<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="IELTS Mastery Hub - Practice all 4 IELTS skills with AI-powered feedback. Speaking, Writing, Reading, and Listening practice targeting Band 6.0+">
  <meta name="keywords" content="IELTS, English test, speaking practice, writing practice, reading practice, listening practice, band 6">
  <title>IELTS Mastery Hub - Your Path to Band 6.0+</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- CSS Files -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/speaking.css">
  <link rel="stylesheet" href="css/writing.css">
  <link rel="stylesheet" href="css/reading.css">
  <link rel="stylesheet" href="css/listening.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="main-nav" id="mainNav" role="navigation" aria-label="Main navigation">
    <div class="nav-brand" id="navBrand">
      <span class="nav-logo">🎓</span>
      <span class="nav-title">IELTS Mastery Hub</span>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false">
      <span class="hamburger"></span>
    </button>
    <ul class="nav-links" id="navLinks" role="menubar">
      <li role="none"><a href="#dashboard" class="nav-link active" role="menuitem" id="navDashboard" data-route="dashboard">
        Dashboard
      </a></li>
      <li role="none"><a href="#speaking" class="nav-link" role="menuitem" id="navSpeaking" data-route="speaking">
        Speaking
      </a></li>
      <li role="none"><a href="#writing" class="nav-link" role="menuitem" id="navWriting" data-route="writing">
        Writing
      </a></li>
      <li role="none"><a href="#reading" class="nav-link" role="menuitem" id="navReading" data-route="reading">
        Reading
      </a></li>
      <li role="none"><a href="#listening" class="nav-link" role="menuitem" id="navListening" data-route="listening">
        Listening
      </a></li>
      <li role="none"><a href="#vocabulary" class="nav-link" role="menuitem" id="navVocabulary" data-route="vocabulary">
        Vocabulary
      </a></li>
    </ul>
  </nav>

  <!-- Main Application Container -->
  <main class="app-container" role="main">
    <div id="view-dashboard" class="route-view"></div>
    <div id="view-speaking" class="route-view" style="display: none;"></div>
    <div id="view-writing" class="route-view" style="display: none;"></div>
    <div id="view-reading" class="route-view" style="display: none;"></div>
    <div id="view-listening" class="route-view" style="display: none;"></div>
    <div id="view-vocabulary" class="route-view" style="display: none;"></div>
  </main>

  <footer class="app-footer">
    <p>Created with <span class="heart">❤️</span> by Di Nguyen</p>
  </footer>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay" role="alert" aria-live="polite" aria-busy="true" style="display: none;">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <p class="loading-text">Processing...</p>
    </div>
  </div>

  <!-- Modal Container -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" style="display: none;">
    <div class="modal" id="modalContainer">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle"></h2>
        <button class="modal-close" id="modalClose" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- JavaScript Files (order matters) -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/router.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/speaking.js"></script>
  <script src="js/writing.js"></script>
  <script src="js/reading.js"></script>
  <script src="js/listening.js"></script>
  <script src="js/vocabulary.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
